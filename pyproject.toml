[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "content-autopilot"
version = "0.1.0"
description = "Evidence-first AI content operations for researchers and builders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "tweepy>=4.14,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
content-autopilot = "content_autopilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/content_autopilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI focused on correctness for the MVP. We can tighten style rules later.
select = ["E4", "E7", "E9", "F"]
